services:
  geoslicerbase-windows:
    image: geoslicerbase-windows:latest
    build:
      context: .
      dockerfile: tools/docker/windows.Dockerfile
    volumes:
      - .:c:/geoslicerbase/
      - ~/.oci/:C:/Users/ContainerAdministrator/.oci/
      - ~/.ssh/:C:/Users/ContainerAdministrator/.ssh/
    storage_opt:
      size: '160GB'
    mem_limit: 24GB
    environment:
      - USING_DOCKER=1
  geoslicerbase-linux:
    image: geoslicerbase-linux:latest
    build:
      context: .
      dockerfile: tools/docker/linux.Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    volumes:
      - .:/geoslicerbase
      - ~/.ssh/:/home/ltrace/.ssh/
      - ~/.oci/:/home/ltrace/.oci/
    mem_limit: 24GB
    environment:
      - USING_DOCKER=1